<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<meta property="og:title" content="唱一句 · 定调子 🎸">
<meta property="og:description" content="哼一句，告诉你是啥调 + do 在哪 + 怎么弹。吉他新手定调器。">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B8%3C/text%3E%3C/svg%3E">
<style>
  /* ============ 设计系统 · 暗黑玻璃拟态 + 霓虹 ============ */
  :root {
    color-scheme: dark;
    --bg: #07080d;
    --surface: rgba(255,255,255,0.055);
    --surface-2: rgba(255,255,255,0.09);
    --ink: #f5f7fb;
    --ink-2: #c8cfdc;
    --muted: #8a92a5;
    --line: rgba(255,255,255,0.10);
    --line-strong: rgba(255,255,255,0.16);
    --accent: #5b9dff;
    --accent-ink: #ffffff;
    --g1: #5b9dff;          /* 渐变主色（录音页中性蓝） */
    --g2: #7a5cff;
    --good: #34d17b;
    --warn: #ffb020;
    --serious: #ff7a6b;
    --radius: 22px;
    --radius-sm: 14px;
    --shadow: 0 24px 60px rgba(0,0,0,0.55);
    --font: -apple-system, "SF Pro Display", "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  body.result-major { --g1: #ffb45c; --g2: #ff5f6d; --accent: #ff9d5c; }
  body.result-minor { --g1: #8f7bff; --g2: #5cb8ff; --accent: #8f86ff; }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior-y: contain;
    overflow-x: hidden;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }

  /* 背景：动态渐变层 + 粒子 canvas */
  #bgGradient { position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(900px 700px at 50% -12%, color-mix(in srgb, var(--g1) 28%, transparent) 0%, transparent 60%),
      radial-gradient(700px 600px at 88% 108%, color-mix(in srgb, var(--g2) 22%, transparent) 0%, transparent 55%),
      var(--bg);
    transition: background 0.8s ease;
  }
  #bgCanvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.55; }

  /* 顶部状态栏（模拟原生 App） */
  .statusbar {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(10px + env(safe-area-inset-top)) 22px 8px;
    font-size: 13px; font-weight: 600; color: var(--ink-2);
  }
  .statusbar .sb-icons { display: flex; gap: 6px; align-items: center; opacity: 0.9; }
  .statusbar .sb-icons svg { width: 16px; height: 12px; fill: currentColor; }

  /* App 容器 + 屏幕转场 */
  .app {
    position: relative; z-index: 2;
    max-width: 430px; margin: 0 auto;
    min-height: 100dvh;
    padding: 0 20px calc(28px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column;
  }
  .screen { display: none; flex-direction: column; flex: 1; }
  .screen.on { display: flex; animation: screenIn 0.42s cubic-bezier(0.22, 0.9, 0.3, 1) both; }
  @keyframes screenIn {
    from { opacity: 0; transform: translateY(18px); filter: blur(6px); }
    to { opacity: 1; transform: none; filter: blur(0); }
  }

  /* 品牌头部 */
  header { text-align: center; margin: 22px 0 8px; }
  .logo { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); padding: 6px 15px; border-radius: 999px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  .logo .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  h1 { font-size: 30px; font-weight: 800; margin-top: 18px; letter-spacing: 0.3px; line-height: 1.15; }
  h1 em { font-style: normal; background: linear-gradient(120deg, var(--g1), var(--g2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 10px; line-height: 1.7; }

  #browserWarn { display: none; background: rgba(255,176,32,0.12); border: 1px solid rgba(255,176,32,0.4); color: var(--warn); border-radius: 14px; padding: 12px 14px; font-size: 13px; line-height: 1.7; margin: 14px 0; }
  #browserWarn.show { display: block; }
  #browserWarn b { color: #ffd66b; }

  /* ============ 录音屏 ============ */
  .rec-area { display: flex; flex-direction: column; align-items: center; flex: 1; justify-content: center; padding: 26px 0 8px; }
  .mic-wrap { position: relative; width: 190px; height: 190px; display: flex; align-items: center; justify-content: center; }
  .mic-ring { position: absolute; border-radius: 50%; border: 1.5px solid var(--accent); opacity: 0.0; pointer-events: none; }
  .mic-wrap::before, .mic-wrap::after {
    content: ''; position: absolute; border-radius: 50%;
    border: 1.5px solid var(--accent); pointer-events: none; opacity: 0.35;
    animation: ringBreathe 3.4s ease-in-out infinite;
  }
  .mic-wrap::before { inset: 0; opacity: 0.22; animation-delay: 0s; }
  .mic-wrap::after { inset: -16px; opacity: 0.12; animation-delay: 1.1s; }
  @keyframes ringBreathe {
    0%, 100% { transform: scale(0.97); opacity: 0.14; }
    50% { transform: scale(1.06); opacity: 0.4; }
  }
  .mic {
    width: 158px; height: 158px; border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, color-mix(in srgb, var(--g1) 88%, #fff) 0%, var(--g1) 42%, var(--g2) 100%);
    color: #fff; border: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.12), 0 24px 60px rgba(0,0,0,0.5), 0 0 46px color-mix(in srgb, var(--g1) 55%, transparent);
    transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
    font-family: var(--font); touch-action: none; position: relative; z-index: 2;
  }
  .mic:active { transform: scale(0.94); }
  .mic .ic { font-size: 40px; line-height: 1; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3)); }
  .mic .t { font-size: 15px; font-weight: 700; margin-top: 8px; letter-spacing: 0.5px; }
  .mic .t2 { font-size: 11px; opacity: 0.88; margin-top: 3px; }
  .mic.recording { background: radial-gradient(circle at 32% 28%, #ff9d8f 0%, #e34948 45%, #9a1f22 100%); }
  .mic.recording .ring1 { animation: pulse 1.3s ease-out infinite; }
  @keyframes pulse { 0% { transform: scale(0.82); opacity: 0.7; } 100% { transform: scale(1.55); opacity: 0; } }

  .hint { color: var(--muted); font-size: 14px; text-align: center; margin-top: 26px; line-height: 1.8; animation: hintPulse 2.6s ease-in-out infinite; }
  .hint b { color: var(--ink-2); font-weight: 600; }
  @keyframes hintPulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
  .live { margin-top: 14px; text-align: center; min-height: 34px; }
  .live .note { font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .live .cents { font-size: 14px; margin-left: 6px; color: var(--ink-2); }
  .live .cents.flat, .live .cents.sharp { color: var(--warn); }
  .live .cents.on { color: var(--good); }
  .live .stamp { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .bar { width: 100%; max-width: 260px; height: 4px; background: var(--surface-2); border-radius: 2px; margin: 12px auto 0; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--g1), var(--g2)); border-radius: 2px; transition: width 0.08s linear; }
  .wave-wrap { display: none; width: 100%; max-width: 320px; height: 60px; margin: 14px auto 0; border-radius: 16px; overflow: hidden; background: var(--surface); border: 1px solid var(--line); }
  .wave-wrap.show { display: block; }
  #wave { width: 100%; height: 100%; display: block; }
  .status { text-align: center; color: var(--ink-2); font-size: 15px; padding: 12px 0; min-height: 24px; }

  /* ============ 分析屏 ============ */
  .analyze-screen { align-items: center; justify-content: center; text-align: center; gap: 6px; }
  #analyzeAnim { width: 100%; max-width: 320px; height: 180px; display: block; margin: 0 auto; }
  .analyze-bar { width: 100%; max-width: 260px; height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; margin: 12px auto 0; }
  .analyze-bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--g1), var(--g2)); border-radius: 4px; transition: width 0.1s linear; }
  .analyze-text { font-size: 14px; color: var(--muted); margin-top: 14px; }

  /* ============ 玻璃卡片 ============ */
  .card {
    background: var(--surface);
    backdrop-filter: blur(22px) saturate(1.2);
    -webkit-backdrop-filter: blur(22px) saturate(1.2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.02), 0 18px 46px rgba(0,0,0,0.35);
  }
  .card-title { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 1.2px; margin-bottom: 14px; text-transform: uppercase; }
  .card-title .tag { float: right; font-size: 11px; text-transform: none; color: var(--ink-2); letter-spacing: 0; font-weight: 500; }

  /* ============ 结果 hero ============ */
  .result-hero { text-align: center; padding: 26px 20px; }
  .key-line { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .key-big { font-size: 68px; font-weight: 800; letter-spacing: 1px; line-height: 1; }
  .key-big small { font-size: 22px; font-weight: 700; color: var(--ink-2); }
  .mode-badge { font-size: 12px; font-weight: 700; padding: 5px 14px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
  .mode-badge.major { background: color-mix(in srgb, var(--g1) 20%, transparent); color: var(--g1); }
  .mode-badge.minor { background: color-mix(in srgb, var(--g2) 20%, transparent); color: var(--g2); }
  #keyBig { animation: breathe 3.2s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { text-shadow: 0 0 14px color-mix(in srgb, var(--g1) 55%, transparent), 0 0 40px color-mix(in srgb, var(--g1) 22%, transparent); }
    50% { text-shadow: 0 0 26px color-mix(in srgb, var(--g1) 95%, transparent), 0 0 70px color-mix(in srgb, var(--g2) 45%, transparent); }
  }
  .conf { margin-top: 14px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); justify-content: center; }
  .conf .meter { flex: 1; max-width: 160px; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
  .conf .meter i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--serious), var(--warn), var(--good)); }
  .conf.low { color: var(--warn); }
  .conf-text { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.6; }
  .tone-map { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 14px; padding: 11px 13px; background: color-mix(in srgb, var(--g1) 9%, transparent); border: 1px solid color-mix(in srgb, var(--g1) 24%, transparent); border-radius: 14px; }
  .tone-map .tm-pill { font-weight: 800; font-size: 15px; padding: 4px 12px; border-radius: 999px; letter-spacing: 0.5px; }
  .tone-map .tm-pill.la { background: rgba(255,122,107,0.2); color: var(--serious); }
  .tone-map .tm-pill.do { background: color-mix(in srgb, var(--g1) 22%, transparent); color: var(--g1); }
  .tone-map .tm-note { color: var(--ink-2); font-size: 12px; line-height: 1.6; flex: 1 1 100%; }
  .rel-hint { margin-top: 12px; font-size: 13px; color: var(--ink-2); line-height: 1.7; }
  .rel-hint button { font-family: var(--font); font-size: 13px; font-weight: 700; color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 36%, transparent); padding: 4px 11px; border-radius: 999px; cursor: pointer; margin: 0 3px; }
  .rel-hint button:active { opacity: 0.7; }

  /* ============ 标签页 ============ */
  .tabbar { display: flex; gap: 6px; margin: 16px 0 4px; padding: 5px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  .tab { flex: 1; min-height: 44px; border: none; border-radius: 999px; background: transparent; color: var(--muted); font-family: var(--font); font-size: 13.5px; font-weight: 600; cursor: pointer; transition: all 0.25s cubic-bezier(0.22, 0.9, 0.3, 1); touch-action: manipulation; }
  .tab.on { background: linear-gradient(140deg, var(--g1), var(--g2)); color: #fff; box-shadow: 0 4px 16px color-mix(in srgb, var(--g1) 40%, transparent); }
  .tabpanels { margin-top: 14px; overflow: hidden; }
  .tabpanel { display: none; }
  .tabpanel.on { display: block; animation: panelIn 0.32s cubic-bezier(0.22, 0.9, 0.3, 1) both; }
  @keyframes panelIn { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }

  /* ============ 简谱 / 旋律 ============ */
  .jianpu-line { display: flex; flex-wrap: wrap; gap: 3px 8px; font-size: 26px; font-weight: 800; color: var(--ink); line-height: 1.2; font-variant-numeric: tabular-nums; }
  .jianpu-line .jp { position: relative; min-width: 20px; text-align: center; cursor: pointer; transition: transform 0.15s, color 0.15s; }
  .jianpu-line .jp.hl { color: var(--accent); transform: scale(1.3); text-shadow: 0 0 16px color-mix(in srgb, var(--accent) 60%, transparent); }
  .jianpu-line .jp .hi-dot, .jianpu-line .jp .lo-dot { position: absolute; left: 0; right: 0; font-size: 11px; color: var(--muted); font-weight: 400; }
  .jianpu-line .jp .hi-dot { top: -14px; }
  .jianpu-line .jp .lo-dot { bottom: -14px; }
  .jianpu-note { font-size: 12px; color: var(--muted); margin-top: 18px; line-height: 1.6; }
  .melody-line { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .mel-note { font-size: 13px; font-weight: 600; background: var(--surface-2); border: 1px solid var(--line); padding: 7px 11px; border-radius: 10px; color: var(--ink-2); display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 42px; }
  .mel-note .sj { font-size: 17px; color: var(--ink); font-weight: 800; }
  .mel-note .abs { font-size: 11px; color: var(--muted); }

  /* ============ 吉他指法 ============ */
  .do-list { display: flex; flex-direction: column; gap: 9px; }
  .do-row { display: flex; align-items: center; gap: 12px; }
  .do-badge { width: 46px; height: 46px; border-radius: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; color: #fff; background: linear-gradient(150deg, var(--g1), var(--g2)); box-shadow: 0 6px 16px color-mix(in srgb, var(--g1) 40%, transparent); }
  .do-badge.la { background: linear-gradient(150deg, #ff8a6b, #c0392b); box-shadow: 0 6px 16px rgba(255,122,107,0.4); }
  .do-row .lbl { font-size: 16px; font-weight: 700; }
  .do-row .pos { font-size: 14px; color: var(--ink-2); margin-top: 2px; }
  #fretboard { width: 100%; height: auto; display: block; margin-top: 10px; border-radius: 12px; }
  #fretboard line { stroke: rgba(127,193,255,0.35) !important; }
  .fb-note { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.6; }
  .play-box { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-top: 6px; font-size: 15px; line-height: 1.8; color: var(--ink); }
  .play-box .capo { font-weight: 800; color: var(--accent); font-size: 17px; }
  .play-alt { font-size: 13px; color: var(--muted); margin-top: 8px; line-height: 1.6; }
  .play-shape { font-size: 13px; color: var(--ink-2); margin-top: 6px; line-height: 1.6; }

  /* ============ 和弦走向 ============ */
  .prog-scroll { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; padding-bottom: 4px; scrollbar-width: none; }
  .prog-scroll::-webkit-scrollbar { display: none; }
  .prog-slide { flex: 0 0 90%; scroll-snap-align: center; background: var(--surface-2); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .prog-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .prog-deg { font-size: 22px; font-weight: 800; color: var(--ink); letter-spacing: 1px; }
  .prog-style { font-size: 12px; color: var(--muted); flex-shrink: 0; }
  .prog-chords { display: flex; align-items: flex-start; }
  .prog-chord { display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1; min-width: 0; }
  .prog-chord .pc-name { font-size: 16px; font-weight: 800; color: var(--ink); }
  .prog-chord .pc-shape { font-size: 11px; color: var(--accent); font-weight: 700; }
  .prog-chord .chord-diagram { width: 100%; max-width: 60px; height: auto; }
  .prog-arrow { color: var(--muted); font-size: 16px; align-self: center; flex-shrink: 0; margin: 0 2px; padding-bottom: 18px; }
  .prog-try { margin-top: 12px; width: 100%; }
  .prog-dots { display: flex; justify-content: center; gap: 6px; margin-top: 10px; }
  .prog-dots .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--surface-2); transition: background 0.2s, width 0.2s; }
  .prog-dots .dot.on { background: var(--accent); width: 16px; border-radius: 3px; }

  /* ============ 节奏型 ============ */
  .rhythm-list { display: flex; flex-direction: column; gap: 10px; }
  .rhythm-item { display: flex; align-items: center; gap: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 16px; padding: 13px 15px; }
  .rhythm-play { flex-shrink: 0; width: 50px; height: 50px; border-radius: 50%; border: none; background: linear-gradient(150deg, var(--g1), var(--g2)); color: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; touch-action: manipulation; transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1); box-shadow: 0 6px 16px color-mix(in srgb, var(--g1) 35%, transparent); }
  .rhythm-play:active { transform: scale(0.9); }
  .rhythm-play.playing { background: linear-gradient(150deg, #ff5f6d, #c0392b); }
  .rhythm-info { flex: 1; min-width: 0; }
  .rhythm-name { font-size: 15px; font-weight: 800; color: var(--ink); }
  .rhythm-name .tag { font-size: 11px; font-weight: 600; color: var(--accent); background: color-mix(in srgb, var(--accent) 15%, transparent); padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: 1px; }
  .rhythm-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .rhythm-tab { font-size: 21px; font-weight: 800; color: var(--g1); letter-spacing: 2px; font-variant-numeric: tabular-nums; flex-shrink: 0; }

  /* ============ 变调夹高亮 ============ */
  .capo-highlight { margin-top: 16px; padding: 14px 16px; border-radius: 16px; background: color-mix(in srgb, var(--g1) 11%, transparent); border: 1px solid color-mix(in srgb, var(--g1) 42%, transparent); box-shadow: 0 0 18px color-mix(in srgb, var(--g1) 22%, transparent), inset 0 0 16px color-mix(in srgb, var(--g1) 5%, transparent); font-size: 15px; line-height: 1.8; }
  .capo-highlight .ch-capo { font-weight: 800; color: #ffd66b; font-size: 18px; }
  .capo-highlight .ch-key { font-weight: 800; color: var(--g1); }
  .capo-highlight .ch-shape { color: var(--ink-2); font-size: 13px; }
  .capo-highlight .ch-rel { color: var(--ink-2); font-size: 13px; margin-top: 6px; }
  .capo-highlight .ch-rel b { color: var(--g1); }
  .capo-highlight .ch-high { color: var(--warn); font-size: 12px; margin-top: 6px; }
  .capo-highlight .ch-alt { color: var(--muted); font-size: 12px; margin-top: 6px; }

  /* ============ 变调夹换算 ============ */
  .capo-form { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .capo-col { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 110px; }
  .capo-col .k { font-size: 12px; color: var(--muted); }
  .capo-col select { font-family: var(--font); font-size: 15px; font-weight: 600; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; min-height: 48px; }

  var JIANPU_OPTS = { minConf: 0.5, minLen: 0.08, leaveCents: 0.5, enterCents: 0.3, leaveMs: 60, unvoicedMs: 100, mergeSlop: 0.05, maxNoteDur: 8 };

  var state = { recording: false, pressing: false, stream: null, audioCtx: null, processor: null, src: null, muteGain: null, buf: [], maxRecS: 15 };
  var frames = [];
  var recordedNotes = null;
  var lastKeyResult = null;

  /* ---------- 诊断面板 ---------- */
  var diag = { version: 'v2.4.0', ctxState: '未创建', mic: '未请求', callCount: 0, peak: 0, ua: navigator.userAgent.slice(0, 40) };
  function updateDiag() {
    var p = $('diagPanel'), dot = $('diagDot');
    var ctxState = state.audioCtx ? state.audioCtx.state : '未创建';
    var peakText = diag.peak < 0.0001 ? '≈0' : diag.peak.toFixed(4);
    var rows = [
      ['版本', diag.version],
      ['浏览器', diag.ua],
      ['AudioContext', ctxState],
      ['麦克风', diag.mic],
      ['音频回调数', String(diag.callCount)],
      ['信号峰值', peakText]
    ];
    p.innerHTML = rows.map(function (r) { return '<div class="row"><span class="k">' + r[0] + '</span><b>' + r[1] + '</b></div>'; }).join('');
    dot.className = 'dot' + (diag.callCount > 0 ? ' ok' : '');
  }
  setInterval(updateDiag, 500);

  /* ---------- 浏览器检测 ---------- */
  (function () {
    var ua = navigator.userAgent.toLowerCase();
    var w = $('browserWarn');
    var name = null, tip = '';
    if (/qihu 360ee|360ee|360 se|se 2\.x metaser|metaser 1\.0/.test(ua)) {
      name = '360 浏览器';
      tip = '360 浏览器的麦克风权限管理和标准浏览器不同，经常出现"已授权但收不到声音"。建议用系统自带的 Edge。';
    } else if (/qqbrowser/.test(ua)) {
      name = 'QQ 浏览器';
      tip = 'QQ 浏览器的麦克风权限可能有特殊拦截，建议用 Edge。';
    } else if (/micromessenger|wechat/.test(ua)) {
      name = '微信内置浏览器';
      tip = '微信内置浏览器对网页麦克风支持有限，请点右上角"在浏览器打开"。';
    } else if (/trident/.test(ua)) {
      name = 'IE 兼容模式';
      tip = '检测到 IE 兼容模式，不支持录音。请切换为"极速模式"。';
    }
    if (name) {
      diag.ua = name + '（' + navigator.userAgent.slice(0, 30) + '）';
      w.className = 'show';
      w.innerHTML = '<b>⚠ ' + name + '</b>：' + tip;
    }
  })();

  /* ---------- 工具 ---------- */
  function midiName(m) { return NOTE_NAMES[((m % 12) + 12) % 12] + String(Math.floor(m / 12) - 1); }
  function setStatus(t) { statusEl.textContent = t || ''; }

  /* ---------- 录音 ---------- */
  function startRecording() {
    if (state.recording) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showError('浏览器不支持麦克风。<b>请用 Chrome / Edge / Safari</b> 打开。');
      return;
    }
    stopAllTones();
    var AC = window.AudioContext || window.webkitAudioContext;
    // 关键：每次录音都用全新 AudioContext，彻底释放上一次的节点和挂起状态。
    // 若复用同一个 context，旧 MediaStreamSource 节点会累积，且 Chrome 在录音停后
    // 会挂起(suspend)它，第二次 resume 不及时就导致 onaudioprocess 不触发（没波形/录不到）。
    try { if (state.audioCtx && state.audioCtx.state !== 'closed') state.audioCtx.close(); } catch (e) {}
    state.audioCtx = new AC();
    diag.ctxState = state.audioCtx.state;
    if (state.audioCtx.state === 'suspended') state.audioCtx.resume();
    diag.mic = '请求中…';
    diag.callCount = 0;
    diag.peak = 0;

    // 问题6：手指按下瞬间立即给视觉反馈 + 同步发起权限请求，不等 getUserMedia 回调
    micBtn.classList.add('recording');
    micBtn.querySelector('.t').textContent = '松开完成';
    micBtn.querySelector('.t2').textContent = '请求麦克风…';
    setStatus('请求麦克风权限…');

    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(function (stream) {
        state.stream = stream;
        diag.mic = '已授权';
        var src = state.audioCtx.createMediaStreamSource(stream);
        var proc = state.audioCtx.createScriptProcessor(2048, 1, 1);
        state.src = src;
        state.processor = proc;
        state.buf = [];
        frames = [];
        recordedNotes = null;

        var sr = state.audioCtx.sampleRate;
        state.recordedSr = sr; // 录音时锁定采样率，供回放/分析（context 可能被重建）
        var recStartT = state.audioCtx.currentTime;
        state.callCount = 0;
        state.waveCap = Math.floor(sr * 0.6);
        state.wave = new Float32Array(state.waveCap);
        state.waveTail = 0;

        proc.onaudioprocess = function (e) {
          try {
            var input = e.inputBuffer.getChannelData(0);
            state.buf.push(Float32Array.from(input));
            writeWave(input);
            state.callCount++;
            diag.callCount = state.callCount;
            diag.mic = '有数据流入 ✓';
            var lp = 0;
            for (var li = 0; li < input.length; li++) { var av = Math.abs(input[li]); if (av > lp) lp = av; }
            if (lp > diag.peak) diag.peak = lp;
            if (state.callCount % 3 === 1 && state.recording) {
              var t = state.audioCtx.currentTime - recStartT;
              var pitch = realtimePitch(input, sr);
              frames.push({ t: t, pitch: pitch.pitch, conf: pitch.conf });
              updateLive(pitch, levelOf(input));
            }
            var elapsed = state.audioCtx.currentTime - recStartT;
            if (elapsed > state.maxRecS) stopRecording();
          } catch (err) { console.error('录音回调出错:', err); }
        };
        // 回退到第一版验证过的直连方式（mute gain 是后来加的，可能是闪退元凶）
        src.connect(proc); proc.connect(state.audioCtx.destination);
        if (state.audioCtx.state === 'suspended') state.audioCtx.resume();

        state.recording = true;
        // 权限弹窗期间用户已松手 → 静默取消，不出错、不残留录音
        if (!state.pressing) { stopRecording(true); return; }
        micBtn.querySelector('.t2').textContent = '最长 ' + state.maxRecS + ' 秒';
        showScreen('record');
        errBox.innerHTML = '';
        $('waveWrap').classList.add('show');
        waveTick();
        setStatus('正在听你唱…');
        liveStamp.textContent = '唱吧！';
      })
      .catch(function (err) {
        console.error(err);
        state.recording = false;
        state.pressing = false;
        micBtn.classList.remove('recording');
        micBtn.querySelector('.t').textContent = '按住唱歌';
        micBtn.querySelector('.t2').textContent = '松开出结果';
        setStatus('');
        diag.mic = '失败: ' + err.name;
        if (err.name === 'NotAllowedError') showError('麦克风权限被拒绝了。<br>请在浏览器地址栏点锁形图标，允许使用麦克风后再试。');
        else if (err.name === 'NotFoundError') showError('没找到麦克风设备。<br>检查系统有没有接入/启用麦克风。');
        else if (err.name === 'NotReadableError') showError('麦克风被其他程序占用了。<br>关闭占用麦克风的程序再试。');
        else showError('启动麦克风失败：' + (err.message || err.name));
      });
  }

  function levelOf(buf) { var s = 0; for (var i = 0; i < buf.length; i++) s += buf[i] * buf[i]; return Math.min(1, Math.sqrt(s / buf.length) * 4); }
  function realtimePitch(buf, sr) {
    var r = window.DSP.yinPitchFrame(buf, sr);
    if (!r) return { pitch: -1, conf: 0 };
    return { pitch: r.pitch, conf: r.confidence };
  }

  function writeWave(input) {
    for (var i = 0; i < input.length; i++) {
      state.wave[state.waveTail] = input[i];
      state.waveTail = (state.waveTail + 1) % state.waveCap;
    }
  }
  function waveTick() {
    if (!state.recording) return;
    drawWave();
    requestAnimationFrame(waveTick);
  }
  function drawWave() {
    var c = $('wave'); if (!c) return;
    var ctx = c.getContext('2d');
    var W = c.width, H = c.height, mid = H / 2;
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(138,145,158,0.35)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, mid); ctx.lineTo(W, mid); ctx.stroke();
    ctx.strokeStyle = '#7ec1ff'; ctx.lineWidth = 1.5;
    var cap = state.waveCap;
    ctx.beginPath();
    for (var x = 0; x < W; x++) {
      var i0 = Math.floor(x / W * cap), i1 = Math.floor((x + 1) / W * cap);
      var peak = 0;
      for (var i = i0; i < i1; i++) { var idx = (state.waveTail + i) % cap; var a = Math.abs(state.wave[idx]); if (a > peak) peak = a; }
      var h = Math.min(H, peak * H * 2.2);
      ctx.moveTo(x, mid - h / 2); ctx.lineTo(x, mid + h / 2);
    }
    ctx.stroke();
  }

  function updateLive(pitch, level) {
    levelBar.style.width = (level * 100).toFixed(0) + '%';
    // 音量驱动背景粒子活跃度 + 麦克风光晕
    if (window.__setBgEnergy) window.__setBgEnergy(level);
    if (window.__setMicGlow) window.__setMicGlow(level);
    if (pitch.pitch < 0 || pitch.conf < 0.5) {
      liveNote.textContent = '…';
      liveCents.textContent = '';
      liveStamp.textContent = level > 0.02 ? '听到啦！继续唱～' : '没听到声音，靠近麦克风唱…';
      return;
    }
    var q = Math.round(pitch.pitch);
    var cents = Math.round((pitch.pitch - q) * 100);
    liveNote.textContent = midiName(q);
    liveCents.textContent = (cents > 0 ? '+' : '') + cents + '¢';
    liveCents.className = 'cents ' + (Math.abs(cents) <= 25 ? 'on' : (cents > 0 ? 'sharp' : 'flat'));
    liveStamp.textContent = '正在识别…';
  }

  function stopRecording(silent) {
    if (!state.recording) return;
    state.recording = false;
    state.pressing = false;
    $('waveWrap').classList.remove('show');
    // 回退到第一版验证过的清理方式（最简，避免新逻辑引入崩溃）
    try { if (state.processor) state.processor.disconnect(); } catch (e) {}
    try { if (state.stream) state.stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
    micBtn.classList.remove('recording');
    micBtn.querySelector('.t').textContent = '按住唱歌';
    micBtn.querySelector('.t2').textContent = '松开出结果';
    liveNote.textContent = '…';
    liveCents.textContent = '';
    if (silent) { setStatus(''); return; } // 权限弹窗期间已松手：静默取消，不分析
    setStatus('正在分析…');
    setTimeout(analyze, 60);
  }

  /* ---------- 分析 ---------- */
  function concatBuffers(chunks) {
    var total = 0;
    for (var i = 0; i < chunks.length; i++) total += chunks[i].length;
    var out = new Float32Array(total);
    var off = 0;
    for (var j = 0; j < chunks.length; j++) { out.set(chunks[j], off); off += chunks[j].length; }
    return out;
  }
  function showAnalyze() { showScreen('analyze'); $('analyzeFill').style.width = '0%'; $('analyzeText').textContent = '正在分析…'; try { startAAnim(); } catch (e) {} }
  function setAnalyzeProgress(pct, note) { $('analyzeFill').style.width = pct.toFixed(0) + '%'; $('analyzeText').textContent = note || ('正在分析… ' + pct.toFixed(0) + '%'); }
  function hideAnalyze() { try { stopAAnim(); } catch (e) {} }

  function analyze() {
    try {
      var pcm = concatBuffers(state.buf);
      // 用录音时锁定的采样率（context 可能已被重建，旧的 sampleRate 不可靠）
      var sr = state.recordedSr || 44100;
      var FRAME = 2048, HOP = 1024;

      // 保存原始 PCM 供"听自己唱的"回放（copy，因为下面会原地归一化）
      state.recordedPcm = new Float32Array(pcm.length);
      state.recordedPcm.set(pcm);
      state.recordedSr = sr;

      if (pcm.length < sr * 0.8) { showError('录得太短了。<br>再唱一次，<b>唱完整一句</b>（4~8 秒）。'); return; }

      var peak = 0;
      for (var pk = 0; pk < pcm.length; pk++) { var a = Math.abs(pcm[pk]); if (a > peak) peak = a; }
      if (peak < 0.01) { showError('好像没录到声音。<br>检查<b>麦克风权限</b>和系统音量，或靠近一点再试。'); return; }
      var norm = 0.9 / peak;
      for (var nm = 0; nm < pcm.length; nm++) pcm[nm] *= norm;

      showAnalyze();
      var nFrames = Math.floor((pcm.length - FRAME) / HOP) + 1;
      var frames = [];
      var fi = 0;
      var BATCH = 40;

      function step() {
        var end = Math.min(fi + BATCH, nFrames);
        for (; fi < end; fi++) {
          var st = fi * HOP;
          var win = pcm.subarray(st, st + FRAME);
          var rms = 0;
          for (var k = 0; k < win.length; k++) rms += win[k] * win[k];
          rms = Math.sqrt(rms / win.length);
          if (rms < 0.03) continue;
          var r = window.DSP.yinPitchFrame(win, sr);
          if (r) frames.push({ t: st / sr, pitch: r.pitch, conf: r.confidence });
        }
        setAnalyzeProgress(fi / nFrames * 100, '正在分析你唱的音… ' + Math.round(fi / nFrames * 100) + '%');
        if (fi < nFrames) setTimeout(step, 16);
        else finishAnalyze(frames);
      }

      function finishAnalyze(allFrames) {
        try {
          if (allFrames.length < 8) { hideAnalyze(); showError('没听到足够的旋律。<br>再唱一次，<b>唱完整一句</b>（4~8 秒）。'); return; }
          // 定调用：稳健分段（合并/容错更强，避免调性翻转）
          var notes = window.DSP.segmentNotes(allFrames);
          if (!notes || notes.length < 2) { hideAnalyze(); showError('没分出清晰的音符。<br>尽量<b>一个音一个音</b>地唱，别拖太长。'); return; }
          // 八度误差修正（方案C）：YIN 偶发把某音判高/低一个八度，修掉孤立尖峰
          notes = window.DSP.fixOctaveErrors(notes);
          // 简谱/旋律用：逐音忠实转录（问题2），每个音高都转成一个符号、不漏音
          var melNotes = window.DSP.fixOctaveErrors(window.DSP.segmentNotes(allFrames, JIANPU_OPTS));
          if (!melNotes || melNotes.length < 2) melNotes = notes;
          // 动态阈值：太短且信息不足时，提示哼长一点，而不是强行猜（问题2）
          var durSec = state.recordedPcm ? state.recordedPcm.length / (state.recordedSr || 44100) : 0;
          if (durSec > 0 && durSec < 3 && melNotes.length < 4) {
            hideAnalyze();
            showError('这段有点短，只听到 ' + melNotes.length + ' 个音。<br>请<b>再哼长一点</b>（唱完整一句副歌，4~8 秒）再试。');
            return;
          }
          // 跨次累加：每次哼唱的音符合并到累计池，用累计集定调（音集越攒越完整，结果收敛）
          state.accNotes = (state.accNotes || []).concat(notes);
          state.curNotes = melNotes; // 最新一次（简谱/回放/唱名显示用，不做跨次拼接）
          state.takeCount = (state.takeCount || 0) + 1;
          // 累计后"落尾"是最后一次哼的收尾，不是歌的结尾 → 跳过落尾一票否决
          var skipVeto = state.takeCount > 1;
          var keyRes = window.KeyDetect.detectKey(state.accNotes, { skipVeto: skipVeto });
          if (!keyRes) { hideAnalyze(); showError('分析失败，请再试一次。'); return; }
          // Essentia KeyExtractor 跨校验（若已加载）：业界基线调性
          keyRes.essentiaKey = essentiaKeyDetect();
          keyRes.shortTake = durSec > 0 && durSec < 3;
          recordedNotes = state.curNotes;
          lastKeyResult = keyRes;
          hideAnalyze();
          renderResult(keyRes, state.curNotes);
        } catch (e) { console.error('分析出错:', e); hideAnalyze(); showError('分析出错：' + (e && e.message ? e.message : e)); }
      }

      step();
    } catch (e) { console.error('analyze 出错:', e); hideAnalyze(); showError('分析出错：' + (e && e.message ? e.message : e)); }
  }

  function showError(msg) {
    showScreen('record');
    hideAnalyze();
    errBox.innerHTML = '<div class="err">' + msg + '</div>';
  }

  /* ---------- 渲染 ---------- */
  var useRelKey = false; // 用户手动切换显示关系调
  function renderResult(key, notes) {
    try {
      errBox.innerHTML = '';
      hideAnalyze();
      var GM = window.GuitarMap;
      // 显示用调：默认用检测结果；用户点了"也可按 X 调"则切到关系调
      var dmode = key.mode, droot = key.rootPC;
      if (useRelKey && key.relMode) { dmode = key.relMode; droot = key.relRoot; }
      var entry = (dmode === 'major' ? GM.MAJOR : GM.MINOR)[droot];
      var doNoteName = GM.midiName(60 + droot).replace(/\d+$/, ''); // 根音音名（去掉八度号）

      // 调名 = 根音音名 + 大小调，与 do 位置严格一致（不再用 entry.key 的 Bm 记法）
      $('keyBig').innerHTML = doNoteName + '<small>' + (dmode === 'major' ? '大调' : '小调') + '</small>';
      var badge = $('modeBadge');
      badge.textContent = dmode === 'major' ? '大调 · 明亮' : '小调 · 忧郁';
      badge.className = 'mode-badge ' + dmode;
      // 大调→暖金呼吸光，小调→冷紫呼吸光（body 类驱动）
      document.body.classList.remove('result-major', 'result-minor');
      document.body.classList.add('result-' + dmode);
      $('metaTag').textContent = '第 ' + (state.takeCount || 1) + ' 次哼唱';

      // 变调夹提示（置于调性大字正下方，首屏高亮可见）
      var capoRec = recommendFingering(dmode, droot);
      var capoShapeChords = SHAPE_CHORDS[capoRec.shape];
      var capoEl = $('capoHighlight');
      var capoMain = capoRec.capo === 0
        ? '不用夹变调夹 · 直接弹 <span class="ch-key">' + capoRec.shape + ' 调开放和弦</span>'
        : '🎸 <span class="ch-capo">变调夹夹 ' + capoRec.capo + ' 品</span> · 用 <span class="ch-key">' + capoRec.shape + ' 调指法</span>';
      var capoRel = '';
      if (dmode === 'minor') {
        var relName = NOTE_NAMES[capoRec.target];
        var tonicChord = NOTE_NAMES[droot] + 'm';
        var tonicShape = capoRec.shape === 'C' ? 'Am' : 'Em';
        capoRel = '<div class="ch-rel">主音 la = ' + NOTE_NAMES[droot] + '，它的关系大调是 ' + relName +
          ' 大调（和弦同一套）：夹 ' + capoRec.capo + ' 品弹 ' + capoRec.shape + ' 调指法，<b>' + tonicShape + ' 手型 = 主和弦 ' + tonicChord + '</b>，' +
          '所以是 ' + relName + ' 大调 / ' + NOTE_NAMES[droot] + ' 小调通用。</div>';
      }
      var capoAlt = '备选：' + capoRec.altShape + ' 调指法夹 ' + capoRec.altCapo + ' 品' + (capoRec.altCapo > 5 ? '（夹得较高，不推荐）' : '');
      var capoHigh = capoRec.highCapo ? '<div class="ch-high">⚠ 夹 ' + capoRec.capo + ' 品偏高、弦偏紧。这个调在吉他上本来就不顺手，建议把原曲移高/低半音再唱会更舒服。</div>' : '';
      capoEl.innerHTML = '<div>' + capoMain + '</div><div class="ch-shape">手型：' + capoShapeChords.join(' · ') + '</div>' + capoRel + capoHigh + '<div class="ch-alt">' + capoAlt + '</div>';

      var pct = Math.round(key.confidence * 100);
      $('confBar').style.width = pct + '%';
      $('confPct').textContent = pct + '%';
      var confRow = $('confRow');
      confRow.className = 'conf' + (pct < 40 ? ' low' : '');
      if (pct >= 70) $('confText').textContent = '识别很稳，放心按这个调弹。';
      else if (pct >= 40) $('confText').textContent = '识别中等。再哼同一句一遍，会自动累加更准（右上角会显示第 N 次）。';
      else $('confText').textContent = '信心不足。建议再哼同一句一遍，音会累加、结果会收敛（右上角显示第 N 次哼唱）。';

      // 音名对照（问题1）：大调 do=主音；小调 la=主音、do=关系大调主音。一眼看懂"6=B、1=D"
      var toneMap = $('toneMap');
      if (dmode === 'major') {
        toneMap.innerHTML = '<span class="tm-pill do">do = ' + NOTE_NAMES[droot] + '</span>' +
          '<span class="tm-note">简谱中 <b>1（do）</b> 就对应 <b>' + NOTE_NAMES[droot] + '</b> 音。</span>';
      } else {
        var relMajPc = (droot + 3) % 12;
        toneMap.innerHTML = '<span class="tm-pill la">la = ' + NOTE_NAMES[droot] + '</span>' +
          '<span class="tm-pill do">do = ' + NOTE_NAMES[relMajPc] + '</span>' +

      var rh = $('relHint');

      // do 位置（问题1）：大调只标 do；小调同时标 la（主音）+ do（关系大调主音）

      var fbGroups = [];

      if (dmode === 'major') {

      }

  /* ---------- 变调夹换算 ---------- */
  var KEY_PCS = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];
  function populateCapoSelects() {
    var src = $('capoSrcSel'), dst = $('capoDstSel');
    var opts = KEY_PCS.map(function (k, i) { return '<option value="' + i + '">' + k + '大调</option>'; }).join('');
    src.innerHTML = opts; dst.innerHTML = opts;
    src.value = '7'; // 默认原曲 G 大调
    if (lastKeyResult) dst.value = String(lastKeyResult.rootPC); // 目标 = 检测到的调
  }
  function capoFriendly(capo) {
    if (capo === 0) return '不夹变调夹';
    if (capo <= 5) return '变调夹夹 ' + capo + ' 品（舒服）';
    if (capo <= 7) return '变调夹夹 ' + capo + ' 品（偏高但可行）';
    return '变调夹夹 ' + capo + ' 品（太高，不推荐）';
  }
  function renderCapo() {
    try {
      var srcPc = parseInt($('capoSrcSel').value, 10);
      var dstPc = parseInt($('capoDstSel').value, 10);
      var diff = dstPc - srcPc; if (diff < -6) diff += 12; if (diff > 6) diff -= 12;
      var cCapo = (dstPc + 12) % 12;      // 用 C 调指法夹几品
      var gCapo = (dstPc - 7 + 12) % 12;  // 用 G 调指法夹几品
      var dir = diff === 0 ? '和原曲一样' : (diff < 0 ? '比原曲低 ' + Math.abs(diff) + ' 个半音' : '比原曲高 ' + diff + ' 个半音');
      var html = '<div class="capo-opt"><span class="lab">你想唱 <b>' + KEY_PCS[dstPc] + '大调</b>（' + dir + '）</span></div>';
      var reco = (cCapo <= gCapo) ? 'c' : 'g';
      if (cCapo > 7) reco = 'g';
      if (gCapo > 7) reco = 'c';
      function block(id, label, capo, chords) {
        var isReco = (id === reco) && capo <= 7;
        var badge = isReco ? '<span class="badge">推荐</span>' : '';
        var cls = 'capo-opt' + (isReco ? ' reco' : '');
        return '<div class="capo-opt ' + cls + '"><div class="lab">' + label + badge + '</div>' +
          '<div class="lab" style="font-size:16px">' + capoFriendly(capo) + '</div>' +
          '<div class="chs">弹这些和弦（手型不变，夹上就是 ' + KEY_PCS[dstPc] + ' 大调）：<br>' + chords.join(' · ') + '</div></div>';
      }
      html += block('c', '用 C 调指法', cCapo, SHAPE_CHORDS.C);
      html += block('g', '用 G 调指法', gCapo, SHAPE_CHORDS.G);
      $('capoResult').innerHTML = html;
    } catch (e) {
      console.error('renderCapo 出错:', e);
      $('capoResult').innerHTML = '变调夹计算出错：' + (e && e.message ? e.message : e);
    }
  }

  function scaleDegreeIndexes(notes, tonicPc, mode) {
    var scaleSems = mode === 'major' ? [0, 2, 4, 5, 7, 9, 11] : [0, 2, 3, 5, 7, 8, 10];
    // 唱名：大调级数 0 = do；小调级数 0 = la（小调主音是 la，不是 do）
    var solfege = mode === 'major' ? ['do', 're', 'mi', 'fa', 'sol', 'la', 'si'] : ['la', 'si', 'do', 're', 'mi', 'fa', 'sol'];
    return notes.map(function (n) {
      var midi = Math.round(n.midi);
      var diff = (((midi % 12) + 12) - tonicPc) % 12;
      var bestI = 0, bestD = 99;
      for (var i = 0; i < 7; i++) {
        var dd = Math.abs(scaleSems[i] - diff); if (dd > 6) dd = 12 - dd;
        if (dd < bestD) { bestD = dd; bestI = i; }
      }
      return { sj: solfege[bestI] };
    });
  }

  /* ---------- 简谱生成（大调主音=1，小调主音=6；高低八度加点） ---------- */
  function buildJianpu(notes, rootPC, mode) {
    var scale = mode === 'major' ? [0, 2, 4, 5, 7, 9, 11] : [0, 2, 3, 5, 7, 8, 10];
    var deg = mode === 'major' ? [1, 2, 3, 4, 5, 6, 7] : [6, 7, 1, 2, 3, 4, 5];
    // 主音基准：音符中心附近最近的 rootPC 音高，贴近用户实际音区
    var mids = notes.map(function (n) { return Math.round(n.midi); }).sort(function (a, b) { return a - b; });
    var center = mids[Math.floor(mids.length / 2)];
    var tonicMid = Math.round((center - rootPC) / 12) * 12 + rootPC;
    if (tonicMid - center > 6) tonicMid -= 12;
    else if (tonicMid - center < -6) tonicMid += 12;
    // 八度基准：大调以 do(主音) 为界；小调主音是 la，do 在 la 下方 9 个半音（同八度）
    var octBase = mode === 'major' ? tonicMid : tonicMid - 9;
    return notes.map(function (n) {
      var midi = Math.round(n.midi);
      var diff = (((midi % 12) - (tonicMid % 12)) + 12) % 12;
      var bestDeg = 0, bestDist = 99;
      for (var i = 0; i < 7; i++) {
        var d = Math.abs(scale[i] - diff); if (d > 6) d = 12 - d;
        if (d < bestDist) { bestDist = d; bestDeg = i; }
      }
      var num = deg[bestDeg];
      var oct = Math.floor((midi - octBase) / 12);
      return { num: num, oct: oct, midi: midi };
    });
  }
  function renderJianpu(notes, rootPC, mode) {
    var box = $('jianpuBox');
    if (!notes || notes.length < 2) { box.style.display = 'none'; return; }
    var jp = buildJianpu(notes, rootPC, mode);
    var line = $('jianpuLine'); line.innerHTML = '';
    jp.forEach(function (j) {
      var el = document.createElement('span');
      el.className = 'jp';
      el.title = midiName(j.midi) + ' · 点按试听';
      var hi = '', lo = '';
      if (j.oct > 0) hi = '<span class="hi-dot">' + '·'.repeat(j.oct) + '</span>';
      if (j.oct < 0) lo = '<span class="lo-dot">' + '·'.repeat(-j.oct) + '</span>';
      // j.num 已是唱名数字：大调 1=do；小调 6=la（不再用 tones 数组二次映射）
      el.innerHTML = hi + String(j.num) + lo;
      // 点击任意简谱符号 → 播放对应音高，验证准确性（问题2）
      (function (midi) {
        el.addEventListener('click', function (e) { e.stopPropagation(); playTone(midi, 0.45); });
      })(j.midi);
      line.appendChild(el);
    });
    // 简谱记谱规则标注：大调 do=主音；小调 la=主音，do=关系大调
    if (mode === 'major') {
      $('jianpuTag').textContent = 'do = ' + NOTE_NAMES[rootPC] + ' · 简谱 1 = ' + NOTE_NAMES[rootPC];
    } else {
      var doPc = (rootPC + 3) % 12;
      $('jianpuTag').textContent = 'la = ' + NOTE_NAMES[rootPC] + ' · do = ' + NOTE_NAMES[doPc] + '（6 = ' + NOTE_NAMES[rootPC] + '，1 = ' + NOTE_NAMES[doPc] + '）';
    }
    $('jianpuNoteInfo').textContent = notes.length + ' 个音 · 点任意数字可试听对应音高';
    box.style.display = 'block';
  }

  function drawFretboard(groups) {
    var svg = $('fretboard');
    var W = 340, H = 200, L = 44, R = 12, T = 24, B = 30;
    var frets = 12, nStr = 6;
    var fw = W - L - R, sw = fw / frets, gap = (H - T - B) / (nStr - 1);
    var s = '';
    for (var str = 0; str < nStr; str++) {
      var y = T + str * gap;
      s += '<line x1="' + L + '" y1="' + y + '" x2="' + (L + fw) + '" y2="' + y + '" stroke="rgba(255,255,255,0.35)" stroke-width="' + (0.6 + str * 0.15) + '"/>';
    }
    for (var f = 0; f <= frets; f++) {
      var x = L + f * sw;
      s += '<line x1="' + x + '" y1="' + T + '" x2="' + x + '" y2="' + (T + gap * (nStr - 1)) + '" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>';
    }
    for (var f2 = 1; f2 <= frets; f2++) s += '<text x="' + (L + f2 * sw - sw / 2) + '" y="' + (T - 8) + '" fill="#8a919e" font-size="9" text-anchor="middle">' + f2 + '</text>';
    [[3,5],[5,7],[7,9],[9,12]].forEach(function (p) {
      s += '<circle cx="' + (L + p[0] * sw - sw / 2) + '" cy="' + (T + gap * 2.5) + '" r="4" fill="rgba(255,255,255,0.10)"/>';
    });
    (groups || []).forEach(function (g) {
      g.positions.forEach(function (dp) {
        var m = dp.pos.match(/(\d)弦(空弦|(\d+)品)/);
        if (!m) return;
        var strN = parseInt(m[1], 10);
        var fret = m[2] === '空弦' ? 0 : parseInt(m[3], 10);
        if (fret > frets) return;
        var yy = T + (nStr - strN) * gap;
        var xx = L + fret * sw + sw / 2;
        s += '<circle cx="' + xx + '" cy="' + yy + '" r="9" fill="' + g.color + '" stroke="#fff" stroke-width="1.5"/>';
        s += '<text x="' + xx + '" y="' + (yy + 3) + '" fill="#fff" font-size="8.5" text-anchor="middle" font-weight="700">' + g.tag + '</text>';
      });
    });
    svg.innerHTML = s;
  }

  /* ---------- 播放引擎（Tone.js 真实采样优先，回退 oscillator） ---------- */
  var TONE_CDN = 'https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js';
  var ESSENTIA_CORE_CDN = 'https://cdn.jsdelivr.net/npm/essentia.js@0.1.3/dist/essentia.js-core.js';
  var ESSENTIA_WASM_CDN = 'https://cdn.jsdelivr.net/npm/essentia.js@0.1.3/dist/essentia-wasm.web.js';
  var SAMPLE_BASE = 'https://gleitz.github.io/midi-js-soundfonts/FluidR3_GM/';
  var FLAT_NAMES = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
  var TIMBRES = {
    nylon: { label: '尼龙弦', folder: 'acoustic_guitar_nylon' },
    steel: { label: '钢弦', folder: 'acoustic_guitar_steel' },
    piano: { label: '钢琴', folder: 'acoustic_grand_piano' }
  };
  var currentTimbre = 'nylon';
  var toneLibLoaded = false;
  var toneSampler = null;
  var toneInit = null;
  var toneStarted = false;
  var toneLoadFailed = false;
  var essentiaObj = null;
  var essentiaInit = null;

  function loadScript(src) {
    return new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = src; s.async = true;
      s.onload = res; s.onerror = function () { rej(new Error('加载失败 ' + src)); };
      document.head.appendChild(s);
    });
  }
  function midiToFlatName(m) { return FLAT_NAMES[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1); }

  // Tone.js 懒加载：加载后构建默认音色采样器
  function initTone() {
    if (toneInit) return toneInit;
    toneInit = loadScript(TONE_CDN).then(function () {
      if (!window.Tone) throw new Error('Tone 未加载');
      toneLibLoaded = true;
      buildToneSampler(currentTimbre);
    }).catch(function () { /* 静默回退 oscillator */ });
    return toneInit;
  }
  // Essentia.js 懒加载：KeyExtractor / ChordsDescriptors 跨校验用
  function initEssentia() {
    if (essentiaInit) return essentiaInit;
    essentiaInit = Promise.all([loadScript(ESSENTIA_CORE_CDN), loadScript(ESSENTIA_WASM_CDN)]).then(function () {
      if (typeof EssentiaWASM !== 'function') throw new Error('essentia 未加载');
      return EssentiaWASM({}).then(function (mod) {
        essentiaObj = new Essentia(mod);
        return essentiaObj;
      });
    }).catch(function () { /* 静默：用原生 K-S 定调 */ });
    return essentiaInit;
  }
  // Essentia 的 key_key 用升号记法（A#/C#/D#/F#/G#），转成 rootPC + mode
  function essentiaKeyToPC(keyName, scale) {
    var SHARP = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    var idx = SHARP.indexOf(keyName);
    if (idx < 0) return null;
    return { rootPC: idx, mode: (scale === 'minor' ? 'minor' : 'major') };
  }
  // Essentia KeyExtractor：业界验证的基线调性（内部 HPCP 和弦感知，跨校验用）
  function essentiaKeyDetect() {
    if (!essentiaObj || !state.recordedPcm || state.recordedPcm.length < 8000) return null;
    try {
      var sr = state.recordedSr || 44100;
      var r = essentiaObj.KeyExtractor(
        state.recordedPcm, undefined, undefined, undefined, undefined,
        undefined, undefined, undefined, undefined, undefined, sr
      );
      if (!r || !r.key_key) return null;
      var pc = essentiaKeyToPC(r.key_key, r.key_scale);
      if (!pc) return null;
      pc.strength = r.key_strength;
      return pc;
    } catch (e) { return null; }
  }

  function buildToneSampler(timbre) {
    if (toneSampler) { try { toneSampler.dispose(); } catch (e) {} toneSampler = null; }
    if (!toneLibLoaded || !window.Tone) return;
    var inst = TIMBRES[timbre];
    var urls = {};
    for (var m = 48; m <= 84; m++) { var n = midiToFlatName(m); urls[n] = n + '.mp3'; }
    try {
      var s = new Tone.Sampler({
        urls: urls,
        baseUrl: SAMPLE_BASE + inst.folder + '-mp3/',
        attack: 0.002, release: 1.4, volume: -6,
        onload: function () { if (currentTimbre === timbre) { toneSampler = s; toneLoadFailed = false; } },
        onerror: function () { if (currentTimbre === timbre) { toneSampler = null; toneLoadFailed = true; } }
      });
      s.toDestination();
      toneSampler = s;
    } catch (e) { toneSampler = null; toneLoadFailed = true; }
  }
  function toneSamplerReady() { return !!(toneSampler && toneSampler.loaded); }
  function ensureToneStarted() { if (!toneStarted) { try { Tone.start(); toneStarted = true; } catch (e) {} } }
  function setTimbre(timbre) {
    if (!TIMBRES[timbre]) return;
    currentTimbre = timbre;
    if (toneLibLoaded) buildToneSampler(timbre);
    document.querySelectorAll('.timbre-btn').forEach(function (b) {
      b.classList.toggle('on', b.dataset.timbre === timbre);
    });
  }

  var playCtx = null;
  function getPlayCtx() {
    if (!playCtx) playCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (playCtx.state === 'suspended') playCtx.resume();
    return playCtx;
  }
  var activeOscs = [];
  function toneOsc(midi, when, dur, vol) {
    try {
      var ctx = getPlayCtx();
      var osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = 440 * Math.pow(2, (midi - 69) / 12);
      g.gain.setValueAtTime(0.0001, when);
      g.gain.exponentialRampToValueAtTime(vol || 0.25, when + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(when); osc.stop(when + dur + 0.03);
      activeOscs.push(osc);
      osc.onended = function () { var i = activeOscs.indexOf(osc); if (i >= 0) activeOscs.splice(i, 1); };
    } catch (e) {}
  }
  // 统一发声入口：offset 相对当前时刻（秒）。优先真实采样，回退 oscillator。
  function playNote(midi, offset, dur, vol) {
    if (toneSamplerReady()) {
      try {
        ensureToneStarted();
        toneSampler.triggerAttackRelease(midi, Math.max(0.08, dur), Tone.now() + offset, vol || 0.8);
        return;
      } catch (e) {}
    }
    toneOsc(midi, getPlayCtx().currentTime + offset, dur, vol || 0.25);
  }
  function stopAllTones() {
    activeOscs.slice().forEach(function (o) { try { o.stop(); } catch (e) {} });
    activeOscs = [];
    if (toneSampler) { try { toneSampler.releaseAll(); } catch (e) {} }
    if (playbackSource) { try { playbackSource.stop(); } catch (e) {} playbackSource = null; }
  }
  // 微小时值偏移：模拟真人弹奏，不机械（±maxSec 秒内随机）
  function humanize(maxSec) { return (Math.random() * 2 - 1) * (maxSec || 0.01); }
  // 按音高调力度：低音略重、高音略轻（模拟哼唱呼吸感）
  function velByPitch(midi, base) {
    return Math.max(0.55, Math.min(0.92, (base || 0.82) - (midi - 60) * 0.006));
  }
  function playTone(midi, dur) { stopAllTones(); playNote(midi, 0.03, dur, velByPitch(midi, 0.8)); }
  function strumChord(voicing, offset, gap, vel) {
    var strs = [6, 5, 4, 3, 2, 1], k = 0;
    for (var i = 0; i < 6; i++) {
      var m = voicing[strs[i]];
      if (m == null) continue;
      // 下扫自然强弱：低音弦略重、高音弦略轻
      playNote(m, offset + k * gap + humanize(0.006), 0.2, (vel || 0.7) * (1 - k * 0.06));
      k++;
    }
  }

  /* ---------- 常用节奏型（问题3）：5323/5321/4321/根音+扫弦，可试听 ---------- */
  function renderRhythms(dmode, droot) {
    var rec = recommendFingering(dmode, droot);
    var list = $('rhythmList'); list.innerHTML = '';
    RHYTHM_PATTERNS.forEach(function (p) {
      var item = document.createElement('div');
      item.className = 'rhythm-item';
      var tab = p.type === 'strum' ? '根+扫' : p.strings.join('');
      item.innerHTML = '<button class="rhythm-play" aria-label="试听 ' + p.name + '">▶</button>' +
        '<div class="rhythm-info"><div class="rhythm-name">' + p.name + '<span class="tag">' + p.tag + '</span></div>' +
        '<div class="rhythm-desc">' + p.desc + '</div></div>' +
        '<div class="rhythm-tab">' + tab + '</div>';
      var btn = item.querySelector('.rhythm-play');
      btn.addEventListener('click', function () {
        var wasPlaying = btn.classList.contains('playing');
        stopAllTones();
        list.querySelectorAll('.rhythm-play').forEach(function (b) { b.classList.remove('playing'); b.textContent = '▶'; });
        if (!wasPlaying) {
          btn.classList.add('playing'); btn.textContent = '■';
          var dur = playRhythm(p, rec.shape);
          setTimeout(function () { if (btn.classList.contains('playing')) { btn.classList.remove('playing'); btn.textContent = '▶'; } }, dur);
        }
      });
      list.appendChild(item);
    });
  }
  function playRhythm(p, shapeName) {
    stopAllTones();
    var voicing = SHAPE_VOICING[shapeName];
    var eighth = 0.24, t = 0.05, bars = 2;
    if (p.type === 'strum') {
      var rootString = shapeName === 'C' ? 5 : 6;
      for (var bar = 0; bar < bars; bar++) {
        playNote(voicing[rootString], t, eighth * 2, 0.92);                     // 根音：重
        strumChord(voicing, t + eighth * 2 + humanize(0.012), 0.04, 0.55);      // 扫弦：轻
        t += eighth * 4;
      }
    } else {
      for (var bar2 = 0; bar2 < bars; bar2++) {
        for (var i = 0; i < p.strings.length; i++) {
          var m = voicing[p.strings[i]];
          if (m == null) { t += eighth; continue; }
          // 4/4 强弱次强弱：每小节第 1 拍最重；根音重、分解音轻
          var isDownbeat = (i % 4 === 0);
          var vel = isDownbeat ? 0.86 : (i % 2 === 0 ? 0.68 : 0.56);
          playNote(m, t + humanize(0.008), eighth * 0.9, vel);
          t += eighth;
        }
      }
    }
    return Math.round(t * 1000) + 300;
  }

  /* ---------- 常用和弦走向（问题4）：指法图 + 滑动 + 风格 + 试听 ---------- */
  function recommendFingering(dmode, droot) {
    // 变调夹只与主音音高有关：大调主音=根音；小调用关系大调（同一套和弦）
    var target = dmode === 'major' ? droot : (droot + 3) % 12;
    var cCapo = target;             // C 调指法夹几品（C→target）
    var gCapo = (target + 5) % 12;  // G 调指法夹几品（G=7 → target 的半音数）
    var shape, capo, altShape, altCapo;
    if (cCapo <= gCapo) { shape = 'C'; capo = cCapo; altShape = 'G'; altCapo = gCapo; }
    else { shape = 'G'; capo = gCapo; altShape = 'C'; altCapo = cCapo; }
    return { shape: shape, capo: capo, altShape: altShape, altCapo: altCapo, target: target, highCapo: capo > 5 };
  }
  function chordName(rootPC, quality) {
    var base = CHORD_ROOTS[((rootPC % 12) + 12) % 12];
    if (quality === 'minor') return base + 'm';
    if (quality === 'dim') return base + 'dim';
    return base;
  }
  function chordDiagramSVG(shape) {
    var W = 110, H = 150, L = 26, R = 14, T = 34, B = 16;
    var sw = (W - L - R) / 5, fw = (H - T - B) / 5;
    var s = [];
    for (var i = 0; i < 6; i++) {
      var x = L + i * sw;
      s.push('<line x1="' + x + '" y1="' + T + '" x2="' + x + '" y2="' + (T + fw * 5) + '" stroke="rgba(255,255,255,0.4)" stroke-width="' + (0.6 + i * 0.12) + '"/>');
    }
    for (var f = 0; f <= 5; f++) {
      var y = T + f * fw;
      s.push('<line x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y + '" stroke="rgba(255,255,255,0.16)" stroke-width="' + (f === 0 ? 3 : 1.2) + '"/>');
    }
    for (var i2 = 0; i2 < 6; i2++) {
      var x2 = L + i2 * sw;
      var fv = shape.frets[i2];
      if (fv === null || fv === undefined) s.push('<text x="' + x2 + '" y="' + (T - 12) + '" fill="#8a919e" font-size="13" text-anchor="middle">×</text>');
      else if (fv === 0) s.push('<text x="' + x2 + '" y="' + (T - 12) + '" fill="#8a919e" font-size="13" text-anchor="middle">○</text>');
    }
    if (shape.barre) {
      var lo = 99, hi = -1;
      for (var i3 = 0; i3 < 6; i3++) { if (shape.frets[i3] === shape.barre) { if (i3 < lo) lo = i3; if (i3 > hi) hi = i3; } }
      if (lo <= hi) {
        var bx = L + lo * sw - 4, bxx = L + hi * sw + 4;
        var by = T + (shape.barre - 0.5) * fw;
        s.push('<rect x="' + bx + '" y="' + (by - 3.5) + '" width="' + (bxx - bx) + '" height="7" rx="3.5" fill="#7ec1ff"/>');
      }
    }
    for (var i4 = 0; i4 < 6; i4++) {
      var f4 = shape.frets[i4];
      if (f4 && f4 > 0 && f4 !== shape.barre) {
        var x4 = L + i4 * sw;
        var y4 = T + (f4 - 0.5) * fw;
        s.push('<circle cx="' + x4 + '" cy="' + y4 + '" r="5.5" fill="#7ec1ff"/>');
      }
    }
    return '<svg class="chord-diagram" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' + s.join('') + '</svg>';
  }
  function renderChordProgressions(dmode, droot) {
    var rec = recommendFingering(dmode, droot);
    var relMajorPc = rec.target;
    var shapeSet = SHAPE_CHORDS[rec.shape];
    var list = PROGRESSIONS[dmode];
    var scroll = $('progScroll'), dots = $('progDots');
    scroll.innerHTML = ''; dots.innerHTML = '';
    list.forEach(function (prog, pi) {
      var slide = document.createElement('div');
      slide.className = 'prog-slide';
      var head = '<div class="prog-head"><span class="prog-deg">' + prog.label + '</span><span class="prog-style">' + prog.style + '</span></div>';
      var chordsHtml = '';
      prog.degrees.forEach(function (deg, di) {
        var root = (relMajorPc + MAJOR_SEMS[deg - 1]) % 12;
        var actualName = chordName(root, MAJOR_QUAL[deg - 1]);
        var shapeName = shapeSet[deg - 1];
        if (di > 0) chordsHtml += '<span class="prog-arrow">→</span>';
        chordsHtml += '<div class="prog-chord"><span class="pc-name">' + actualName + '</span>' +
          chordDiagramSVG(CHORD_SHAPES[shapeName]) +
          '<span class="pc-shape">' + shapeName + '</span></div>';
      });
      slide.innerHTML = head + '<div class="prog-chords">' + chordsHtml + '</div>' +
        '<button class="btn prog-try">▶ 试听走向</button>';
      scroll.appendChild(slide);
      var dot = document.createElement('span');
      dot.className = 'dot' + (pi === 0 ? ' on' : '');
      dots.appendChild(dot);
    });
    scroll.querySelectorAll('.prog-try').forEach(function (btn, pi) {
      btn.addEventListener('click', function () { playProgression(list[pi], relMajorPc); });
    });
    scroll.addEventListener('scroll', function () {
      var idx = Math.round(scroll.scrollLeft / Math.max(1, scroll.clientWidth * 0.92));
      if (idx < 0) idx = 0; if (idx >= list.length) idx = list.length - 1;
      dots.querySelectorAll('.dot').forEach(function (d, di) { d.className = 'dot' + (di === idx ? ' on' : ''); });
    });
    var capoNote = rec.capo > 0 ? '（现在用 ' + rec.shape + ' 调指法夹 ' + rec.capo + ' 品，照手型按即可）' : '（直接弹 ' + rec.shape + ' 调开放和弦）';
    $('progTip').innerHTML = '左右滑动切换走向。把第 1 个和弦当「家」来回循环，就是一首歌的骨架。' + capoNote;
  }
  function playProgression(prog, relMajorPc) {
    stopAllTones();
    var t = 0.05, cd = 0.85;
    prog.degrees.forEach(function (deg) {
      var root = (relMajorPc + MAJOR_SEMS[deg - 1]) % 12;
      var quality = MAJOR_QUAL[deg - 1];
      var sems3 = quality === 'minor' ? [0, 3, 7] : [0, 4, 7];
      var base = 48 + root;
      playNote(base, t, cd * 0.6, 0.8);
      playNote(base + sems3[1], t + cd * 0.25, cd * 0.4, 0.7);
      playNote(base + sems3[2], t + cd * 0.45, cd * 0.4, 0.7);
      t += cd;
    });
  }

  /* ---------- 事件 ---------- */
  // 问题6：移动端用 touchstart + mousedown 双触发，手指按下立即开始录音；
  // 不再用 pointer 事件（部分老 iOS/安卓 WebView 不派发 pointerdown，导致"点不动"）。
  function pressStart(e) {
    if (e.cancelable) e.preventDefault(); // 干掉 300ms 延迟与合成 click，避免点按穿透
    state.pressing = true;
    startRecording();
  }
  function pressEnd(e) {
    if (e.cancelable) e.preventDefault();
    state.pressing = false;
    if (state.recording) stopRecording();
  }
  micBtn.addEventListener('touchstart', pressStart, { passive: false });
  micBtn.addEventListener('mousedown', pressStart);
  micBtn.addEventListener('touchend', pressEnd, { passive: false });
  micBtn.addEventListener('touchcancel', pressEnd);
  micBtn.addEventListener('mouseup', pressEnd);
  micBtn.addEventListener('mouseleave', function () { state.pressing = false; if (state.recording) stopRecording(); });
  micBtn.addEventListener('contextmenu', function (e) { e.preventDefault(); }); // 长按不弹菜单
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && e.target === document.body) {
      e.preventDefault();
      if (state.recording) { state.pressing = false; stopRecording(); }
      else { state.pressing = true; startRecording(); }
    }
  });
  function resetSession() {
    // 再测一次：清空跨次累加池 + 关系调切换状态 + 回放数据，不保留任何残留
    state.accNotes = []; state.takeCount = 0; state.recordedPcm = null; state.curNotes = null;
    recordedNotes = null; lastKeyResult = null; useRelKey = false;
    stopAllTones();
    showScreen('record');
    $('capoCard').style.display = 'none';
    $('jianpuBox').style.display = 'none';
    $('hearSelfBtn').style.display = 'none';
    $('singBtn').style.display = 'none';
    $('timbreBar').style.display = 'none';
    errBox.innerHTML = '';
    liveNote.textContent = '—'; liveCents.textContent = ''; liveStamp.textContent = '按着按钮开始唱';
    setStatus('');
    try { window.scrollTo(0, 0); } catch (e) {}
  }
  $('againBtn').addEventListener('click', resetSession);
  $('capoSrcSel').addEventListener('change', renderCapo);
  $('capoDstSel').addEventListener('change', renderCapo);
  $('replayBtn').addEventListener('click', replayMelody);
  $('singBtn').addEventListener('click', speakSolfege);
  $('hearSelfBtn').addEventListener('click', playSelfRecording);

  // 音色切换（问题1）
  document.querySelectorAll('.timbre-btn').forEach(function (btn) {
    btn.addEventListener('click', function () { setTimbre(btn.dataset.timbre); haptic(); });
  });

  // 结果页标签切换
  document.querySelectorAll('.tabbar .tab').forEach(function (btn) {
    btn.addEventListener('click', function () { switchTab(btn.dataset.tab); });
  });

  // 触觉反馈：所有主要按钮点击时“咔哒”一声
  document.querySelectorAll('.btn, .rhythm-play, .jianpu-line').forEach(function (el) {
    el.addEventListener('click', function () { haptic(); });
  });

  // 页面加载后后台懒加载 Tone.js（真实采样）+ Essentia.js（定调跨校验），失败静默回退
  try { initTone(); initEssentia(); } catch (e) {}

  /* ---------- 唱名跟读（TTS，仅"念名字"，旋律听感靠 oscillator） ---------- */
  var ttsVoicesReady = false;
  if (window.speechSynthesis) {
    window.speechSynthesis.onvoiceschanged = function () { ttsVoicesReady = true; };
    window.speechSynthesis.getVoices();
  }
  function speakSolfege() {
    try {
      if (!recordedNotes || !lastKeyResult) return;
      if (!window.speechSynthesis) { alert('这个浏览器不支持语音朗读'); return; }
      var idxs = scaleDegreeIndexes(recordedNotes, lastKeyResult.rootPC, lastKeyResult.mode);
      var words = idxs.map(function (x) { return SOLFEGE_ZH[x.sj]; });
      var voices = window.speechSynthesis.getVoices();
      var zh = voices.filter(function (v) { return v.lang && v.lang.toLowerCase().indexOf('zh') === 0; });
      var voice = zh.find(function (v) { return /huihui|kangkang|yaoyao|xiaoxiao/i.test(v.name); }) || zh[0];
      if (!voice && !ttsVoicesReady) { alert('语音库还在加载，等一下再点，或先点"♪ 听旋律"听音高。'); return; }
      if (!voice) { alert('系统没有中文语音包，无法朗读唱名。你可以点"♪ 听旋律"听真实音高。'); return; }
      var u = new SpeechSynthesisUtterance('你唱的是：' + words.join('，'));
      u.lang = 'zh-CN'; u.voice = voice; u.rate = 0.9;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    } catch (e) { console.error('唱名跟读出错:', e); }
  }

  /* ---------- 录音回放（听自己唱的） ---------- */
  var playbackSource = null;
  function playSelfRecording() {
    try {
      if (!state.recordedPcm) return;
      stopAllTones();
      var ctx = getPlayCtx();
      if (ctx.state === 'suspended') ctx.resume();
      if (playbackSource) { try { playbackSource.stop(); } catch (e) {} playbackSource = null; }
      var buf = ctx.createBuffer(1, state.recordedPcm.length, state.recordedSr);
      buf.getChannelData(0).set(state.recordedPcm);
      playbackSource = ctx.createBufferSource();
      var g = ctx.createGain(); g.gain.value = 0.8;
      playbackSource.buffer = buf;
      playbackSource.connect(g); g.connect(ctx.destination);
      playbackSource.start();
      playbackSource.onended = function () { playbackSource = null; };
    } catch (e) { console.error('回放出错:', e); }
  }

  function replayMelody() {
    if (!recordedNotes || !lastKeyResult) return;
    stopAllTones();
    var t = 0.05;
    recordedNotes.forEach(function (n, idx) {
      var midi = Math.round(n.midi);
      var dur = Math.max(0.12, n.dur);
      // 连奏感：加长 release 让尾音搭到下一音；力度随音高（低重高轻）
      playNote(midi, t, dur + 0.18, velByPitch(midi, 0.8));
      // 简谱字幕高亮：音符响起时高亮对应的 .jp 数字
      (function (i, delay) {
        setTimeout(function () {
          var els = $('jianpuLine').querySelectorAll('.jp');
          for (var e = 0; e < els.length; e++) els[e].classList.remove('hl');
          if (els[i]) els[i].classList.add('hl');
        }, delay);
      })(idx, Math.round(t * 1000));
      t += Math.max(0.16, n.dur) + 0.04;
    });
  }

  window.addEventListener('beforeunload', function () {
    if (state.stream) state.stream.getTracks().forEach(function (tr) { tr.stop(); });
  });

  window.__debug = { renderResult: renderResult, analyze: analyze, stopRecording: stopRecording, startRecording: startRecording, drawFretboard: drawFretboard };
})();
</script>
</body>
