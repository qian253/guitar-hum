<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔍 唱一句·定调子 —— 手机实时预览</title>
<style>
  :root { --bg: #2B2320; --frame: #4A3B33; --paper: #FFF9F0; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); font-family: 'Microsoft YaHei', sans-serif; color: #E8DDD0; display: flex; flex-direction: column; align-items: center; padding: 18px 12px 30px; }
  h1 { font-size: 17px; font-weight: 800; margin: 0 0 4px; }
  .sub { font-size: 12.5px; color: #B3A298; margin-bottom: 16px; text-align: center; }
  .sub b { color: #F0B79A; }
  .phone { width: 390px; height: 844px; background: #000; border-radius: 44px; padding: 10px; box-shadow: 0 0 0 6px var(--frame), 0 0 0 8px #221B18, 0 24px 60px rgba(0,0,0,.5); position: relative; }
  .phone::before { content: ''; position: absolute; top: 18px; left: 50%; transform: translateX(-50%); width: 120px; height: 22px; background: #000; border-radius: 12px; z-index: 5; }
  .phone iframe { width: 100%; height: 100%; border: none; border-radius: 34px; background: var(--paper); }
  .toolbar { margin-top: 16px; display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .btn { border: 2px solid #6B5B52; background: #3D322C; color: #E8DDD0; font-weight: 700; font-size: 13.5px; padding: 9px 18px; border-radius: 999px; cursor: pointer; }
  .btn:hover { border-color: #F0B79A; color: #F0B79A; }
  .tip { margin-top: 12px; font-size: 12px; color: #8A766C; text-align: center; line-height: 1.7; }
</style>
</head>
<body>
  <h1>🔍 唱一句·定调子 · 手机实时预览</h1>
  <div class="sub">Claude 保存代码时才刷新,平时纹丝不动 · 进度清单看聊天窗口 · 测录音点「↗ 新标签打开」或手机</div>

  <div class="phone"><iframe id="appFrame"></iframe></div>

  <div class="toolbar">
    <button class="btn" onclick="document.getElementById('appFrame').src=location.origin+'/index.html?t='+Date.now()">🔄 手动刷新</button>
    <span class="btn" id="refreshStatus" style="border-style:dashed;cursor:default">👀 监视中(改动才刷新)</span>
    <button class="btn" onclick="window.open(location.origin+'/index.html')">↗ 新标签打开(测录音)</button>
    <button class="btn" onclick="location.reload()">↻ 刷新本预览页</button>
  </div>

  <div class="tip">
    手机真机:连同一个 Wi-Fi,访问 <b>http://本机IP:8017</b>(CMD 里 ipconfig 查 IP)<br>
    双机摆放:双击 hum-key 文件夹里的 arrange_preview.ps1(VSCode 左 + 浏览器右)
  </div>

  <script>
    var origin = location.origin;
    (function () {
      var frame = document.getElementById('appFrame');
      if (location.protocol === 'file:') {
        frame.srcdoc = '<div style="padding:60px 20px;text-align:center;font-family:sans-serif;color:#8A766C">请通过服务器打开本页:<br>双击 hum-key 文件夹里的「一键预览.bat」</div>';
        return;
      }
      frame.src = origin + '/index.html';
    })();
    // 智能刷新:index.html 改动(Last-Modified 变化)才重载 iframe
    var lastMod = null;
    var statusEl = document.getElementById('refreshStatus');
    function checkApp() {
      fetch(origin + '/index.html', { method: 'HEAD', cache: 'no-store' }).then(function (res) {
        var lm = res.headers.get('Last-Modified');
        if (!lm) return;
        if (lastMod !== null && lm !== lastMod) {
          document.getElementById('appFrame').src = origin + '/index.html?t=' + Date.now();
          if (statusEl) { statusEl.textContent = '🔄 已更新 ' + new Date().toLocaleTimeString(); statusEl.style.color = '#4E9B6E'; }
        }
        lastMod = lm;
      }).catch(function () {});
    }
    setInterval(checkApp, 2000);
    checkApp();
  </script>
</body>
</html>
